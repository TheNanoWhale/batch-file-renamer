name: Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test

      - name: Build portable exe
        run: cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: batch-file-renamer-windows-x64
          path: target/release/batch-file-renamer.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/batch-file-renamer.exe
          generate_release_notes: true
          body: |
            免安装 Windows x64：下载 `batch-file-renamer.exe` 后直接双击运行。

            **修改文件名需谨慎，请提前做好数据备份。** 本工具只改文件名，不复制测序数据。
